<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Naval</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Batalha Naval</h1>
        <div class="boards-container">
            <div class="board-section">
                <h2>Seu Tabuleiro</h2>
                <div id="player-board" class="board"></div>
            </div>
            <div class="board-section">
                <h2>Tabuleiro do Computador</h2>
                <div id="computer-board" class="board"></div>
            </div>
        </div>
        <div class="controls">
            <button id="restart-btn">Reiniciar Jogo</button>
            <div id="status">Clique nas casas do tabuleiro do computador para atirar!</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
