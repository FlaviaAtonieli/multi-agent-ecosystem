# Coleta as métricas do backend (GET /metrics) a cada 15s.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agenthub-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    # Se METRICS_TOKEN estiver definido no .env, descomente e grave o mesmo
    # valor em monitoring/prometheus/metrics_token (fora do git):
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
