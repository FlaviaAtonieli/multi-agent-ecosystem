# Coleta as métricas do backend no Azure. Usado por docker-compose.azure-monitoring.yml
# (ver docs/monitoring.md, seção "Monitorar o backend no Azure").
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agenthub-backend
    metrics_path: /metrics
    scheme: https
    static_configs:
      - targets: ["multi-agent-ecosystem-back-gycbeha6crc0c0cv.westus3-01.azurewebsites.net"]
    # Mesmo valor de METRICS_TOKEN no App Service. O arquivo fica fora do git.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
