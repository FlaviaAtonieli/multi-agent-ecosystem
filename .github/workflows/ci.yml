name: CI

# Núcleo comum de engenharia: CI/CD + análise estática no pipeline. Roda
# ruff/mypy (backend) e tsc/build (frontend) em todo push/PR -- a suíte de
# testes do backend chama a OpenRouter de verdade, sem mock (ver README,
# seção "Testes"), então fica fora deste workflow de propósito: rodar a
# cada push gastaria créditos reais e poderia ficar vermelho por
# instabilidade do provedor, não por bug de código. Os testes continuam
# rodando localmente antes de cada PR.

on:
  push:
    # Só main aqui -- uma branch com PR aberta já dispara via pull_request
    # abaixo; disparar os dois pro mesmo commit dobra os jobs concorrentes
    # à toa (visto na prática: um job ficou preso na fila por >10min com
    # dois runs competindo pelo mesmo commit).
    branches: [main]
  pull_request:
    branches: [main]

# Cancela um run anterior ainda em andamento pra mesma branch/PR quando um
# push novo chega, em vez de deixar os dois competirem por runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-analysis:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        # Sem --no-cache-dir aqui (diferente do comando de teste local em
        # Docker no README): o cache do pip precisa ser populado pra
        # actions/setup-python's "cache: pip" ter o que salvar no post-step.
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy app

  frontend-static-analysis:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Type-check + build
        run: npm run build
