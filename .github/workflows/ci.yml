name: CI

# Núcleo comum de engenharia: CI/CD + análise estática no pipeline. Roda
# ruff/mypy (backend), os testes do backend que não chamam a OpenRouter e
# tsc/build/testes (frontend) em todo push/PR, com as metas de cobertura da
# linha de Web Apps (75% no backend, 25% no frontend). Os testes marcados com
# @pytest.mark.llm chamam a OpenRouter de verdade, sem mock (ver README,
# seção "Testes"), então ficam fora deste workflow de propósito: rodar a
# cada push gastaria créditos reais e poderia ficar vermelho por
# instabilidade do provedor, não por bug de código. Eles continuam
# rodando localmente antes de cada PR.

on:
  push:
    # Só main aqui -- uma branch com PR aberta já dispara via pull_request
    # abaixo; disparar os dois pro mesmo commit dobra os jobs concorrentes
    # à toa (visto na prática: um job ficou preso na fila por >10min com
    # dois runs competindo pelo mesmo commit).
    branches: [main]
  pull_request:
    branches: [main]

# Cancela um run anterior ainda em andamento pra mesma branch/PR quando um
# push novo chega, em vez de deixar os dois competirem por runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-analysis:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.lock

      - name: Instalar dependências
        # Sem --no-cache-dir aqui (diferente do comando de teste local em
        # Docker no README): o cache do pip precisa ser populado pra
        # actions/setup-python's "cache: pip" ter o que salvar no post-step.
        run: "pip install --only-binary :all: --require-hashes -r requirements-dev.lock"

      - name: ruff check
        run: ruff check .

      - name: mypy
        run: mypy app

  backend-tests:
    name: Backend (pytest sem LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.lock

      - name: Instalar dependências
        run: "pip install --only-binary :all: --require-hashes -r requirements-dev.lock"

      - name: pytest (exceto testes que chamam a OpenRouter)
        run: pytest -m "not llm" -v --cov=app --cov-report=term --cov-fail-under=75

  frontend-static-analysis:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Type-check + build
        run: npm run build

  frontend-tests:
    name: Frontend (testes e cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Testes com meta de cobertura (vite.config.ts)
        run: npm run coverage

  postgres-migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:teste@localhost:5432/agenthub
      AUTO_CREATE_TABLES: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Instalar dependências
        run: "pip install --only-binary :all: --require-hashes -r requirements.lock"

      - name: Conferir a migração dos clãs com dados
        run: python scripts/check_clan_migration.py

  docker-images:
    name: Imagens Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build do backend
        run: docker build -t backend-teste backend

      - name: Build do frontend
        run: docker build -t frontend-teste frontend
