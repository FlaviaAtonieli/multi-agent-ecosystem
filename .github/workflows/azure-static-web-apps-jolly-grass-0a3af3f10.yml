name: Azure Static Web Apps CI/CD

# Gerado pelo portal do Azure ao criar o Static Web App; ajustado à mão.
# Publica o frontend (Vite) a cada push na main. O backend é o App Service
# ligado ao Static Web App como "linked backend", que recebe tudo em /api/*
# (ver docs/deployment/azure.md, seção do Static Web Apps).
#
# Sem pull_request: os ambientes de pré-visualização de PR do Static Web Apps
# não aceitam linked backend, então subiriam um site sem API. O build do
# frontend já é validado em todo PR pelo ci.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GRASS_0A3AF3F10 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Pasta gerada pelo `vite build` (não "build")
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

