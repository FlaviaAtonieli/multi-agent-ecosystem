name: Publish images

# Builda e publica a imagem Docker do backend no GitHub Container
# Registry a cada push na main -- pre-requisito pro deploy no Azure (App
# Service puxa a imagem de la, ver docs/deployment/azure.md). Gratuito pra
# imagem publica, sem precisar de Azure Container Registry pago.
#
# Depois de publicar, o job deploy-backend chama o webhook de implantacao
# continua do App Service (docs/deployment/azure.md, secao 8). Sem o segredo
# AZURE_BACKEND_DEPLOY_WEBHOOK, ele so avisa, e o redeploy segue manual. O
# frontend em producao e publicado pelo workflow do Static Web Apps.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-backend:
    name: Backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/multi-agent-ecosystem-backend
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" backend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  deploy-backend:
    name: Deploy do backend no App Service
    needs: publish-backend
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o webhook de implantação contínua
        env:
          DEPLOY_WEBHOOK: ${{ secrets.AZURE_BACKEND_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then
            echo "::notice::Sem AZURE_BACKEND_DEPLOY_WEBHOOK: reinicie o App Service manualmente."
            exit 0
          fi
          # -o e --silent: a URL e a resposta não podem aparecer no log, porque a URL contém a senha de publicação.
          curl --silent --fail --max-time 60 --request POST --output /dev/null "$DEPLOY_WEBHOOK"
