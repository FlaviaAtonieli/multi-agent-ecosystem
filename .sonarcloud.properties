# Configuração da análise automática do SonarCloud.
#
# S2068 (senha no código) dá falso positivo na documentação da API: as descrições
# citam campos como "password", e os exemplos do Swagger usam senhas fictícias, que
# precisam atender à regra de senha forte porque tests/test_api_examples.py valida
# cada exemplo com os schemas da API. Nenhum dos dois arquivos tem credencial real.
sonar.issue.ignore.multicriteria=docsExamples,docsContract
sonar.issue.ignore.multicriteria.docsExamples.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.docsExamples.resourceKey=backend/app/api/openapi_examples.py
sonar.issue.ignore.multicriteria.docsContract.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.docsContract.resourceKey=docs/api/openapi.json
