# Configuração da análise automática do SonarCloud.
#
# docs/api/openapi.json é gerado por backend/scripts/export_openapi.py a partir do
# código, que já é analisado. Analisá-lo de novo só repete os falsos positivos de
# senha (S2068): os exemplos do Swagger usam senhas fictícias, que precisam atender
# à regra de senha forte porque tests/test_api_examples.py valida cada exemplo.
# Em backend/app/api/openapi_examples.py, as mesmas linhas estão marcadas com NOSONAR.
sonar.exclusions=docs/api/openapi.json
