[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# Migrations sao scaffolding gerado pelo Alembic (op.create_table com colunas
# listadas verbatim, sem quebra de linha) -- nao reformatadas pro estilo do
# app pra nao editar arquivos ja aplicados contra bancos reais so por lint.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends(...) as a default argument is FastAPI's required pattern, not a bug.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
